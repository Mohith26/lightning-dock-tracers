[project]
name = "ldtracer"
version = "0.1.0"
description = "Tracer-test and production analysis for the Lightning Dock geothermal data package (GDR 1856)"
readme = "README.md"
requires-python = ">=3.10"
license = {text = "MIT"}
dependencies = ["numpy>=1.24", "pandas>=2.0", "matplotlib>=3.7"]

[project.optional-dependencies]
test = ["pytest>=7"]

[build-system]
requires = ["setuptools>=64"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = ["ldtracer"]
